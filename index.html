<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Sports Display</title>
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  /* Rotated -90 degrees (Counter-Clockwise) */
  body {
    display: flex;
    flex-direction: column;
    width: 100vh;
    height: 100vw;
    transform: rotate(-90deg);
    transform-origin: top left;
    position: absolute;
    top: 100vh;
    left: 0;
    cursor: pointer; /* Visual cue that clicking activates fullscreen */
  }

  header { padding: 28px 24px 18px; border-bottom: 2px solid #222; flex-shrink: 0; }
  .title { font-size: 34px; font-weight: 800; letter-spacing: 1px; }
  .status { margin-top: 7px; color: #aaa; font-size: 16px; }
  
  /* Scroll Container Setup */
  main { flex: 1; padding: 18px 20px; overflow: hidden; display: flex; flex-direction: column; }
  .sport { font-size: 30px; font-weight: 800; margin: 0 0 14px; flex-shrink: 0; }
  .games-wrapper { flex: 1; overflow: hidden; position: relative; }
  .games { display: flex; flex-direction: column; gap: 12px; position: relative; top: 0; transition: transform 0.05s linear; }
  
  /* Team & Logo Layout */
  .game { background: #111; border: 1px solid #252525; border-radius: 12px; padding: 14px; }
  .league { color: #888; font-size: 13px; text-transform: uppercase; margin-bottom: 8px; }
  .team { display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: 700; padding: 4px 0; }
  .team-info { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; object-fit: contain; }
  .score { font-variant-numeric: tabular-nums; }
  .state { color: #bbb; font-size: 13px; margin-top: 7px; }
  .empty { color: #888; font-size: 20px; padding-top: 25px; }
  footer { padding: 12px 20px 20px; color: #777; font-size: 13px; text-align: center; flex-shrink: 0; }
</style>
</head>
<body>
<header>
  <div class="title">LIVE SPORTS</div>
  <div class="status" id="status">Loading scores…</div>
</header>
<main>
  <div class="sport" id="sport">Sports</div>
  <div class="games-wrapper" id="wrapper">
    <div class="games" id="games"></div>
  </div>
</main>
<footer id="footer">Double-click screen for full screen • Auto-rotating</footer>

<script>
const sports = [
  {name:"NFL", url:"https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"},
  {name:"NBA", url:"https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard"},
  {name:"MLB", url:"https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard"},
  {name:"NHL", url:"https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard"},
  {name:"NCAA FOOTBALL", url:"https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard"},
  {name:"NCAA BASKETBALL", url:"https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard"}
];

let current = 0;
const ROTATE_MS = 20000;
const REFRESH_MS = 60000;
let scrollInterval = null;

// Fullscreen toggle on double-click
document.body.addEventListener("dblclick", () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => console.log(err));
  } else {
    document.exitFullscreen();
  }
});

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function eventHTML(e) {
  const comp = e.competitions?.[0];
  if (!comp) return "";
  const teams = comp.competitors || [];
  const home = teams.find(t => t.homeAway === "home") || teams[0];
  const away = teams.find(t => t.homeAway === "away") || teams[1];
  const state = e.status?.type?.shortDetail || e.status?.type?.description || "";
  const league = comp.league?.name || "";

  const awayLogo = away?.team?.logo || away?.team?.logos?.[0]?.href || "";
  const homeLogo = home?.team?.logo || home?.team?.logos?.[0]?.href || "";

  const awayImg = awayLogo ? `<img class="logo" src="${esc(awayLogo)}" alt="" />` : "";
  const homeImg = homeLogo ? `<img class="logo" src="${esc(homeLogo)}" alt="" />` : "";

  return `<div class="game">
    <div class="league">${esc(league)}</div>
    <div class="team">
      <div class="team-info">${awayImg}<span>${esc(away?.team?.abbreviation || away?.team?.displayName)}</span></div>
      <span class="score">${esc(away?.score ?? "-")}</span>
    </div>
    <div class="team">
      <div class="team-info">${homeImg}<span>${esc(home?.team?.abbreviation || home?.team?.displayName)}</span></div>
      <span class="score">${esc(home?.score ?? "-")}</span>
    </div>
    <div class="state">${esc(state)}</div>
  </div>`;
}

function startAutoScroll() {
  stopAutoScroll();
  const wrapper = document.getElementById("wrapper");
  const games = document.getElementById("games");
  
  games.style.transform = "translateY(0px)";
  
  const maxScroll = games.scrollHeight - wrapper.clientHeight;
  if (maxScroll <= 0) return;

  let currentY = 0;
  const scrollSpeed = 1;
  const delayStart = 2000;

  setTimeout(() => {
    scrollInterval = setInterval(() => {
      if (Math.abs(currentY) < maxScroll) {
        currentY -= scrollSpeed;
        games.style.transform = `translateY(${currentY}px)`;
      } else {
        clearInterval(scrollInterval);
      }
    }, 30);
  }, delayStart);
}

function stopAutoScroll() {
  if (scrollInterval) clearInterval(scrollInterval);
}

async function loadSport(index) {
  stopAutoScroll();
  const s = sports[index];
  document.getElementById("sport").textContent = s.name;
  document.getElementById("games").innerHTML = '<div class="empty">Loading live scores…</div>';
  try {
    const r = await fetch(s.url + (s.url.includes("?") ? "&" : "?") + "limit=20");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const events = data.events || [];
    
    const gamesEl = document.getElementById("games");
    gamesEl.innerHTML = events.length 
      ? events.map(eventHTML).join("") 
      : '<div class="empty">No games scheduled right now.</div>';
      
    document.getElementById("status").textContent =
      "Live scores • " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
      
    setTimeout(startAutoScroll, 100);

  } catch (err) {
    document.getElementById("games").innerHTML =
      '<div class="empty">Scores temporarily unavailable. Trying again soon.</div>';
    document.getElementById("status").textContent = "Waiting for score feed…";
  }
}

loadSport(current);
setInterval(() => {
  current = (current + 1) % sports.length;
  loadSport(current);
}, ROTATE_MS);

setInterval(() => loadSport(current), REFRESH_MS);
</script>
</body>
</html>
